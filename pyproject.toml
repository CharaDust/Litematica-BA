[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litematicaba"
version = "0.1.0"
description = "LitematicaBA Qt rewrite foundation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
litematicaba = "litematicaba.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
