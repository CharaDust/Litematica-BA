<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LitematicaBA Deepslate</title>
  <style>
    html, body { margin: 0; height: 100%; background: #2a2d34; overflow: hidden; }
    #c { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <!-- 设计 §2.6.3.8：脚本与库均为应用内本地文件；勿依赖远程脚本（避免 MIME / CSP 问题） -->
  <script>
(function () {
  window.__lbaVoxelQueue = [];
  window.__lbaViewPreset = 0;
  window.lbaLoadVoxelsB64 = function (b64) {
    window.__lbaVoxelQueue.push(b64);
    if (typeof window.__lbaInternalApplyVoxels === "function") {
      while (window.__lbaVoxelQueue.length) {
        window.__lbaInternalApplyVoxels(window.__lbaVoxelQueue.shift());
      }
    }
  };
  window.lbaSetViewPreset = function (n) {
    window.__lbaViewPreset = Math.max(0, Math.min(8, n | 0));
    window.__lbaSyncViewFromPreset = true;
  };
  window.__lbaInvertY = false;
  window.lbaSetInvertY = function (v) {
    window.__lbaInvertY = !!v;
  };
  window.__lbaCameraFov = 70;
  window.lbaSetCameraFov = function (deg) {
    window.__lbaCameraFov = Math.max(0, Math.min(110, deg | 0));
  };
})();
  </script>
  <script src="vendor/gl-matrix-min.js"></script>
  <script src="vendor/deepslate.umd.js"></script>
  <script>
(function () {
  const canvas = document.getElementById("c");
  const gl = canvas.getContext("webgl", { alpha: true, premultipliedAlpha: false, antialias: true });
  if (!gl) {
    document.body.textContent = "WebGL 不可用";
    window.__lbaInternalApplyVoxels = function () {};
    return;
  }
  const DS = window.deepslate;
  if (!DS || !DS.VoxelRenderer) {
    document.body.textContent = "Deepslate 未加载（请检查 vendor/deepslate.umd.js）";
    window.__lbaInternalApplyVoxels = function () {};
    return;
  }
  const { mat4, vec3 } = glMatrix;
  const voxelRenderer = new DS.VoxelRenderer(gl);
  voxelRenderer.getPerspective = function () {
    const aspect = this.gl.canvas.clientWidth / this.gl.canvas.clientHeight;
    const out = mat4.create();
    const fov = window.__lbaCameraFov | 0;
    if (fov <= 0) {
      const halfH = Math.max(camDist * 0.38, 2.5);
      const halfW = halfH * aspect;
      mat4.ortho(out, -halfW, halfW, -halfH, halfH, 0.1, 500);
    } else {
      const rad = Math.max(1, Math.min(110, fov)) * Math.PI / 180;
      mat4.perspective(out, rad, aspect, 0.1, 500);
    }
    return out;
  };

  let camDist = 64;
  /** 观察目标（世界坐标），右键拖动平移 */
  const pan = vec3.create();
  /** 轨道角：绕 Y 为 yaw，仰角为 pitch（弧度） */
  let yaw = 0;
  let pitch = 0;
  window.__lbaSyncViewFromPreset = true;

  function normalize3(out, x, y, z) {
    const len = Math.hypot(x, y, z);
    if (len < 1e-8) {
      out[0] = 0; out[1] = 1; out[2] = 0;
      return out;
    }
    out[0] = x / len; out[1] = y / len; out[2] = z / len;
    return out;
  }

  /** 与旧版九向预设一致的方向向量（单位化），用于同步 yaw/pitch */
  function presetDirection(p) {
    const d = 1;
    const dh = 0.45;
    const o = [0, 0, 0];
    switch (p | 0) {
      case 0:
        return normalize3(o, 0, 1, 0);
      case 1:
        return normalize3(o, 0, dh, -d);
      case 2:
        return normalize3(o, 0, dh, d);
      case 3:
        return normalize3(o, -d, dh, 0);
      case 4:
        return normalize3(o, d, dh, 0);
      case 5:
        return normalize3(o, d * 0.82, d * 0.55, -d * 0.82);
      case 6:
        return normalize3(o, d * 0.82, d * 0.55, d * 0.82);
      case 7:
        return normalize3(o, -d * 0.82, d * 0.55, d * 0.82);
      default:
        return normalize3(o, -d * 0.82, d * 0.55, -d * 0.82);
    }
  }

  function syncFromPreset() {
    const dir = presetDirection(window.__lbaViewPreset | 0);
    pitch = Math.asin(Math.max(-1, Math.min(1, dir[1])));
    yaw = Math.atan2(dir[0], dir[2]);
    pan[0] = 0;
    pan[1] = 0;
    pan[2] = 0;
    window.__lbaSyncViewFromPreset = false;
  }

  /** 由 yaw/pitch/camDist/pan 得到 view 矩阵（Y 轴向上） */
  function buildViewMatrix(out) {
    const cp = Math.cos(pitch);
    const sp = Math.sin(pitch);
    const sy = Math.sin(yaw);
    const cy = Math.cos(yaw);
    const dir = vec3.fromValues(cp * sy, sp, cp * cy);
    const eye = vec3.create();
    vec3.scaleAndAdd(eye, pan, dir, camDist);
    let up = vec3.fromValues(0, 1, 0);
    if (Math.abs(dir[1]) > 0.98) {
      up[0] = 0; up[1] = 0; up[2] = dir[1] > 0 ? -1 : 1;
    }
    mat4.lookAt(out, eye, pan, up);
    return out;
  }

  let dragMode = 0;
  let lastPx = 0;
  let lastPy = 0;
  const ORBIT_SENS = 0.005;
  const PITCH_MIN = -1.45;
  const PITCH_MAX = 1.45;
  const CAM_DIST_MIN = 2;
  const CAM_DIST_MAX = 50000;
  const WHEEL_ZOOM_SENS = 0.0012;

  function panScale() {
    const w = canvas.clientWidth || 1;
    const h = canvas.clientHeight || 1;
    return (camDist * 0.0022) / Math.min(w, h) * Math.max(w, h);
  }

  canvas.addEventListener("contextmenu", function (e) {
    e.preventDefault();
  });

  canvas.addEventListener(
    "wheel",
    function (e) {
      e.preventDefault();
      let dy = e.deltaY;
      if (e.deltaMode === 1) dy *= 16;
      else if (e.deltaMode === 2) dy *= canvas.clientHeight || 1;
      camDist *= Math.exp(-dy * WHEEL_ZOOM_SENS);
      if (camDist < CAM_DIST_MIN) camDist = CAM_DIST_MIN;
      if (camDist > CAM_DIST_MAX) camDist = CAM_DIST_MAX;
    },
    { passive: false }
  );

  canvas.addEventListener("pointerdown", function (e) {
    if (e.button === 0) {
      dragMode = 1;
    } else if (e.button === 2) {
      dragMode = 2;
    } else {
      return;
    }
    lastPx = e.clientX;
    lastPy = e.clientY;
    try {
      canvas.setPointerCapture(e.pointerId);
    } catch (_err) {}
  });

  canvas.addEventListener("pointermove", function (e) {
    if (!dragMode) return;
    const dx = e.clientX - lastPx;
    const dy = e.clientY - lastPy;
    lastPx = e.clientX;
    lastPy = e.clientY;

    const ySign = window.__lbaInvertY ? -1 : 1;
    if (dragMode === 1) {
      yaw -= dx * ORBIT_SENS;
      // 未勾选「反转 Y」：鼠标向下拖 → 视角向下（常见 FPS/建模习惯）；勾选后与触摸屏「拖动内容」习惯一致
      pitch += dy * ORBIT_SENS * ySign;
      if (pitch < PITCH_MIN) pitch = PITCH_MIN;
      if (pitch > PITCH_MAX) pitch = PITCH_MAX;
    } else if (dragMode === 2) {
      const view = mat4.create();
      buildViewMatrix(view);
      const inv = mat4.create();
      mat4.invert(inv, view);
      const right = vec3.fromValues(inv[0], inv[4], inv[8]);
      const upv = vec3.fromValues(inv[1], inv[5], inv[9]);
      vec3.normalize(right, right);
      vec3.normalize(upv, upv);
      const k = panScale();
      vec3.scaleAndAdd(pan, pan, right, -dx * k);
      vec3.scaleAndAdd(pan, pan, upv, dy * k * ySign);
    }
  });

  function endDrag(e) {
    if (e.button === 0 || e.button === 2) {
      dragMode = 0;
    }
    try {
      canvas.releasePointerCapture(e.pointerId);
    } catch (_err) {}
  }

  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("lostpointercapture", function () {
    dragMode = 0;
  });

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
    const h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    voxelRenderer.setViewport(0, 0, canvas.width, canvas.height);
  }

  window.addEventListener("resize", resize);

  const viewMat = mat4.create();

  function tick() {
    resize();
    if (window.__lbaSyncViewFromPreset) {
      syncFromPreset();
    }
    buildViewMatrix(viewMat);
    voxelRenderer.draw(viewMat);
    requestAnimationFrame(tick);
  }

  window.__lbaInternalApplyVoxels = function (b64) {
    try {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const json = new TextDecoder().decode(bytes);
      const data = JSON.parse(json);
      if (typeof data.camDist === "number" && data.camDist > 1) {
        camDist = data.camDist;
      }
      const list = Array.isArray(data.voxels) ? data.voxels : [];
      const normalized = [];
      for (let i = 0; i < list.length; i++) {
        const v = list[i];
        if (!v || typeof v.x !== "number" || typeof v.y !== "number" || typeof v.z !== "number") continue;
        let c = v.color;
        if (!c || c.length < 3) c = [128, 128, 128];
        normalized.push({ x: v.x, y: v.y, z: v.z, color: [c[0], c[1], c[2]] });
      }
      voxelRenderer.setVoxels(normalized);
    } catch (e) {
      console.error(e);
      voxelRenderer.setVoxels([]);
    }
  };

  while (window.__lbaVoxelQueue.length) {
    window.__lbaInternalApplyVoxels(window.__lbaVoxelQueue.shift());
  }

  resize();
  requestAnimationFrame(tick);
})();
  </script>
</body>
</html>
